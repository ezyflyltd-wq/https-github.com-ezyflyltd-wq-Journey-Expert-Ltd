<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Rich Crimson Red Radial Gradient for the Emblem -->
    <radialGradient id="jelRedGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="45%" stop-color="#E60000"/>
      <stop offset="80%" stop-color="#B30000"/>
      <stop offset="100%" stop-color="#7A0000"/>
    </radialGradient>

    <!-- Dark Facet Shadow Overlay -->
    <linearGradient id="jelShade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#400000" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#800000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF3333" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Group for Emblem (Centered Horizontally) -->
  <g transform="translate(400, 180)">
    <!-- Red Circle Base -->
    <circle cx="0" cy="0" r="145" fill="url(#jelRedGrad)"/>
    
    <!-- Depth Shading Overlay -->
    <path d="M 0 -145 A 145 145 0 0 1 145 0 A 145 145 0 0 1 -105 140 C -10 120 120 60 120 -10 C 120 -80 60 -130 0 -145 Z" fill="url(#jelShade)"/>

    <!-- White Soaring Flight Symbol (Matches attached master logo) -->
    <path d="M -102 12
             C -55 -10 -5 -35 25 -52
             C 38 -65 48 -75 52 -78
             C 60 -80 78 -80 110 -79
             C 65 -15 15 45 -22 105
             C -38 130 -48 152 -49 153
             C -42 125 -20 85 8 45
             C 45 -12 85 -60 110 -79
             C 72 -79 45 -65 18 -48
             C -32 -20 -80 0 -102 12 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Official Bold Green Typography: JOURNEY EXPERT LTD. -->
  <text x="400" y="405" 
        text-anchor="middle" 
        font-family="'Trebuchet MS', 'Arial Black', 'Montserrat', sans-serif" 
        font-weight="900" 
        font-size="52" 
        letter-spacing="1.5" 
        fill="#0B5D3B">JOURNEY EXPERT LTD.</text>
</svg>
