name: BD GSC DNS verification preflight
on:
  push:
    branches:
      - diagnostic/bd-gsc-dns-preflight-20261001
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7b0d4036973a06b9cd4622770748a101"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clients
        run: python -m pip install --upgrade google-auth requests
      - name: Verify credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GSC_SERVICE_ACCOUNT_JSON"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "REQUIRED_SECRETS=AVAILABLE"
      - name: Google Site Verification preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info=json.loads(os.environ['GSC_SERVICE_ACCOUNT_JSON'])
          creds=service_account.Credentials.from_service_account_info(
              info,
              scopes=[
                'https://www.googleapis.com/auth/siteverification.verify_only',
                'https://www.googleapis.com/auth/webmasters.readonly',
              ],
          )
          creds.refresh(Request())
          print('SERVICE_ACCOUNT_EMAIL', info.get('client_email','unknown'))

          r=requests.post(
              'https://www.googleapis.com/siteVerification/v1/token',
              headers={'Authorization': f'Bearer {creds.token}', 'Content-Type':'application/json'},
              json={
                'site': {'type':'INET_DOMAIN','identifier':'journeyexpertbd.com'},
                'verificationMethod':'DNS_TXT',
              },
              timeout=30,
          )
          print('SITE_VERIFICATION_TOKEN_STATUS', r.status_code)
          if r.status_code != 200:
              print('SITE_VERIFICATION_ERROR', r.text[:700])
              raise SystemExit(31)
          token=str(r.json().get('token') or '')
          if not token:
              raise SystemExit('No DNS verification token returned')
          print('DNS_TOKEN_AVAILABLE', True)
          print('DNS_TOKEN_SHA256_PREFIX', hashlib.sha256(token.encode()).hexdigest()[:12])

          s=requests.get(
              'https://www.googleapis.com/webmasters/v3/sites',
              headers={'Authorization': f'Bearer {creds.token}'},
              timeout=30,
          )
          print('SEARCH_CONSOLE_SITES_STATUS', s.status_code)
          if s.ok:
              entries=s.json().get('siteEntry',[])
              for e in entries:
                  print('GSC_SITE',e.get('siteUrl'),'PERMISSION',e.get('permissionLevel'))
          PY
      - name: Cloudflare DNS API preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          r=requests.get(
              'https://api.cloudflare.com/client/v4/zones',
              headers=headers,
              params={'name':'journeyexpertbd.com','status':'active'},
              timeout=30,
          )
          print('CF_ZONE_LOOKUP_STATUS',r.status_code)
          try: data=r.json()
          except Exception: data={}
          print('CF_ZONE_LOOKUP_SUCCESS',bool(data.get('success')))
          results=data.get('result') or []
          print('CF_ZONE_MATCH_COUNT',len(results))
          if not r.ok or not data.get('success') or len(results)!=1:
              print('CF_ZONE_LOOKUP_ERRORS',str(data.get('errors'))[:700])
              raise SystemExit(41)
          zone=results[0]
          print('CF_ZONE_NAME',zone.get('name'))
          print('CF_ZONE_ID_PREFIX',str(zone.get('id',''))[:8])
          # Read-only DNS list verifies the token can at least see DNS records.
          d=requests.get(
              f"https://api.cloudflare.com/client/v4/zones/{zone['id']}/dns_records",
              headers=headers,
              params={'type':'TXT','per_page':5},
              timeout=30,
          )
          print('CF_DNS_READ_STATUS',d.status_code)
          try: dd=d.json()
          except Exception: dd={}
          print('CF_DNS_READ_SUCCESS',bool(dd.get('success')))
          if not d.ok or not dd.get('success'):
              print('CF_DNS_READ_ERRORS',str(dd.get('errors'))[:700])
              raise SystemExit(42)
          print('BD_GSC_DNS_PREFLIGHT=PASS')
          PY
