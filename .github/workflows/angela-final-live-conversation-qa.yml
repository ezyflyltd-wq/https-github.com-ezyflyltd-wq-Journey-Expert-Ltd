name: Angela Final Live Conversation and Voice QA
on:
  push:
    branches: [release]
    paths: ['.github/workflows/angela-final-live-conversation-qa.yml']
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both public homepages and real Bengali answer-to-speech
        run: |
          node <<'NODE'
          (async()=>{
            const websites=[
              {site:'LTD',origin:'https://journeyexpertltd.com',chat:'/angela/chat',
                tts:'/angela/speech',payload:m=>({message:m,language:'bn',history:[]})},
              {site:'BD',origin:'https://journeyexpertbd.com',chat:'/api/gemini/chat',
                tts:'/api/angela/speech',payload:m=>({messages:[{sender:'user',text:m}],language:'bn',source:'text'})},
            ];
            const question='স্টাডি অ্যাব্রডের জন্য SOP লেখার সময় কেন কোর্স বেছে নিয়েছি সেটা কীভাবে ব্যাখ্যা করব?';
            let errors=0;
            for(const target of websites){
              let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),28000);
              try{
                const home=await fetch(target.origin,{signal:controller.signal});
                if(!home.ok)throw Error('homepage HTTP '+home.status);
                clearTimeout(timer);
                controller=new AbortController();timer=setTimeout(()=>controller.abort(),28000);
                const response=await fetch(target.origin+target.chat,{
                  method:'POST',headers:{'content-type':'application/json'},
                  body:JSON.stringify(target.payload(question)),signal:controller.signal});
                const data=await response.json().catch(()=>({}));
                const answer=String(data.reply||'');
                const chatPass=response.ok && data.mode==='ai' && answer.length>90 &&
                  /[\u0980-\u09FF]/.test(answer);
                console.log('FINAL_LIVE_CHAT',JSON.stringify({site:target.site,http:response.status,mode:data.mode||null,
                  model:data.providerModel||null,answerLength:answer.length,pass:chatPass}));
                if(!chatPass){errors++;continue}
                clearTimeout(timer);
                controller=new AbortController();timer=setTimeout(()=>controller.abort(),30000);
                const spoken=answer.slice(0,1050);
                const tts=await fetch(target.origin+target.tts,{
                  method:'POST',headers:{'content-type':'application/json'},
                  body:JSON.stringify({text:spoken}),signal:controller.signal});
                const bytes=Buffer.from(await tts.arrayBuffer());
                const voice=tts.headers.get('x-angela-voice'),mode=tts.headers.get('x-angela-voice-mode');
                const pass=tts.ok && voice==='Aoede' && mode==='native-bengali-female' &&
                  bytes.length>1200 && bytes.toString('ascii',0,4)==='RIFF' && bytes.toString('ascii',8,12)==='WAVE';
                let failure=null;if(!pass)try{failure=JSON.parse(bytes.toString('utf8').slice(0,700))}catch{}
                console.log('FINAL_LIVE_SPEECH',JSON.stringify({site:target.site,http:tts.status,voice,mode,
                  inputChars:spoken.length,wavBytes:bytes.length,pass,
                  failure:pass?null:{error:failure?.error||'unknown',providerStatus:failure?.providerStatus||null}}));
                if(!pass)errors++;
              }catch(e){errors++;console.log('FINAL_LIVE_ERROR',target.site,String(e))}
              finally{clearTimeout(timer)}
            }
            console.log('FINAL_LIVE_RESULT',errors===0?'PASS':'FAIL',errors);
            process.exitCode=errors?1:0;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
