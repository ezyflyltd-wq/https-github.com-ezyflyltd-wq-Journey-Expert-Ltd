name: Angela validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-safety-gate:
    name: Sync safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve reviewed commit message
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            reviewed_sha="${{ github.event.pull_request.head.sha }}"
          else
            reviewed_sha="$GITHUB_SHA"
          fi
          {
            echo 'GITHUB_COMMIT_MESSAGE<<SYNC_COMMIT_MESSAGE'
            git log -1 --format=%B "$reviewed_sha"
            echo 'SYNC_COMMIT_MESSAGE'
            echo 'GITHUB_HEAD_COMMIT_MESSAGE<<SYNC_HEAD_COMMIT_MESSAGE'
            git log -1 --format=%B "$reviewed_sha"
            echo 'SYNC_HEAD_COMMIT_MESSAGE'
          } >> "$GITHUB_ENV"
      - name: Run sync safety gate
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/sync-guard.mjs

  type-check-and-pages-build:
    name: Type-check and Pages build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Build Pages frontend
        run: ./node_modules/.bin/vite build
      - name: Run Angela regression tests
        run: |
          node tests/free-voice-widget-check.mjs
          node tests/angela-public-widget-check.mjs
          node tests/angela-responsive-brain-check.mjs
