name: Angela Native Pronunciation and Full Audio
on:
  push:
    branches: [release]
    paths: ['.github/workflows/angela-audio-live-test.yml']
  workflow_dispatch:
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify complete English female WAV and reject broken phonetic Bengali audio
        run: |
          node <<'NODE'
          (async()=>{
            const longText=('Journey Expert Limited offers careful help with airline tickets, visa documentation, admissions and travel planning. We cannot promise visa decisions or admission results. ').repeat(6).slice(0,850);
            const probes=[
              {site:'LTD English complete',url:'https://journeyexpertltd.com/angela/speech',text:longText,bengali:false},
              {site:'BD English complete',url:'https://journeyexpertbd.com/api/angela/speech',text:longText,bengali:false},
              {site:'LTD Bengali native only',url:'https://journeyexpertltd.com/angela/speech',text:'আমি অ্যাঞ্জেলা, আপনাকে সাহায্য করতে পারি।',bengali:true},
              {site:'BD Bengali native only',url:'https://journeyexpertbd.com/api/angela/speech',text:'আমি অ্যাঞ্জেলা, আপনাকে সাহায্য করতে পারি।',bengali:true},
            ];
            let fails=0;
            for(const probe of probes){
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),24000);
              try{
                const res=await fetch(probe.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:probe.text}),signal:controller.signal});
                const data=Buffer.from(await res.arrayBuffer());
                const wav=res.status===200&&data.subarray(0,4).toString()==='RIFF'&&data.subarray(8,12).toString()==='WAVE'&&data.length>1200;
                const error=res.status===422?JSON.parse(data.toString('utf8')).error:null;
                const spoken=Number(res.headers.get('x-angela-spoken-chars')||0);
                const voiceMode=res.headers.get('x-angela-voice-mode');
                const pass=probe.bengali
                  ? (res.status===422&&error==='native_bengali_voice_required') ||
                    (wav&&voiceMode!=='banglish-phonetic-female'&&res.headers.get('x-angela-voice')!=='Athena')
                  : wav&&spoken>=probe.text.length-2&&voiceMode==='english-female-full-reply';
                const info={site:probe.site,http:res.status,bytes:data.length,spoken,voice:res.headers.get('x-angela-voice'),model:res.headers.get('x-angela-voice-model'),mode:voiceMode,error,pass};
                if(!pass){info.details=data.toString('utf8').slice(0,180);fails++}
                console.log('AUDIO_PROBE',JSON.stringify(info));
              }catch(e){console.log('AUDIO_PROBE_ERROR',probe.site,String(e));fails++}
              finally{clearTimeout(timer)}
            }
            console.log('AUDIO_PROBES_RESULT',fails===0?'PASS':'FAIL',fails);
            process.exitCode=fails?1:0;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
