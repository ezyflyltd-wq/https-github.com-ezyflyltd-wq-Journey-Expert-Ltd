name: Cloudflare Direct Pages Deploy
# [approved-production-change] Reviewed guarded release-branch deployment path.
# Preview smoke uses the immutable Wrangler deployment URL before production promotion.

on:
  workflow_run:
    workflows: ["Production Guard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: journey-expert-ltd-cloudflare-direct
  cancel-in-progress: false

jobs:
  deploy:
    name: Direct deploy journey-expert-ltd-main
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7b0d4036973a06b9cd4622770748a101"

    steps:
      - name: Check out validated release source
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Verify exact promoted release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            expected="${{ github.event.workflow_run.head_sha }}"
            test "$source_sha" = "$expected" || {
              echo "::error::release SHA $source_sha does not match validated main SHA $expected"
              exit 1
            }
          fi
          echo "Validated release SHA: $source_sha"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run lint

      - name: Build Cloudflare Pages output
        run: pnpm run build:pages

      - name: Verify Pages and Angela contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_headers
          test -f dist/_redirects
          test -f functions/api/[[path]].ts
          pnpm run test:free-voice

      - name: Detect Cloudflare deployment credential
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare direct-deploy credential is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare direct deploy skipped because CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
          fi

      - name: Deploy preview through Wrangler
        if: steps.cf.outputs.available == 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          npx --yes wrangler@4 pages deploy dist \
            --project-name=journey-expert-ltd-main \
            --branch=direct-ltd-smoke \
            --commit-hash="${{ steps.source.outputs.sha }}" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "$log" | head -n1 || true)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview Pages and Angela
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.preview.outputs.url }}"
          health=""
          for attempt in 1 2 3 4 5 6; do
            health="$(curl --fail --silent --show-error --max-time 30 "$url/api/health" || true)"
            if echo "$health" | jq -e '.status == "online"' >/dev/null 2>&1; then
              break
            fi
            echo "Preview health not ready yet (attempt $attempt); retrying..."
            sleep 3
          done
          echo "$health" | jq -e '.status == "online"'
          echo "$health" | jq -e '.service | contains("Journey Expert") or contains("Angela API Gateway") or contains("JEL Angela Pages Worker")'

          reply_file="$(mktemp)"
          trap 'rm -f "$reply_file"' EXIT
          curl --fail --silent --show-error --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"message":"ami Malaysia tourist visa niye jante chai","language":"bn","history":[]}' \
            --output "$reply_file" \
            "$url/api/ai/voice-agent"
          python - "$reply_file" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          reply = str(data.get("reply") or data.get("response") or "").strip()
          if not reply:
              raise SystemExit("Angela preview returned no reply")
          if not re.search(r"[\u0980-\u09ff]", reply):
              raise SystemExit("Angela preview did not return Bengali")
          if "live ai unavailable" in reply.lower():
              raise SystemExit("Angela preview returned degraded unavailable message")
          print("Preview Angela Bangla smoke passed")
          PY

      - name: Deploy production through Wrangler
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name=journey-expert-ltd-main \
            --branch=release \
            --commit-hash="${{ steps.source.outputs.sha }}"

      - name: Verify public production
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          health="$(curl --fail --silent --show-error --max-time 30 https://journeyexpertltd.com/api/health)"
          echo "$health" | jq -e '.status == "online"'

          reply_file="$(mktemp)"
          trap 'rm -f "$reply_file"' EXIT
          curl --fail --silent --show-error --max-time 30 \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertltd.com' \
            --data '{"message":"ami Malaysia tourist visa ebong tour package niye jante chai","language":"bn","history":[]}' \
            --output "$reply_file" \
            https://journeyexpertltd.com/api/ai/voice-agent
          python - "$reply_file" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          reply = str(data.get("reply") or data.get("response") or "").strip()
          if not reply:
              raise SystemExit("Production Angela returned no reply")
          if not re.search(r"[\u0980-\u09ff]", reply):
              raise SystemExit("Production Angela did not return Bengali")
          if "live ai unavailable" in reply.lower():
              raise SystemExit("Production Angela returned degraded unavailable message")
          print("Production Angela Bangla smoke passed")
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare Direct Pages Deploy"
            echo "- Project: journey-expert-ltd-main"
            echo "- Production branch: release"
            echo "- Source: ${{ steps.source.outputs.sha }}"
            echo "- Direct-deploy credential available: ${{ steps.cf.outputs.available || 'unknown' }}"
            echo "- Safety: validated release source is type-checked and built before deployment."
            echo "- Safety: preview health and Bangla Angela smoke must pass before production."
            echo "- Existing DNS, custom domains, bindings, and dashboard variables are not modified."
          } >> "$GITHUB_STEP_SUMMARY"
