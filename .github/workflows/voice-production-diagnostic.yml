name: Angela voice production diagnostic
on:
  push:
    branches: [diag/voice-production-20260921]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production Pages API alias
        shell: bash
        run: |
          set -u
          base="https://journey-expert-ltd-main.pages.dev"
          for path in /api/ai/voice-agent /api/voice/gemini; do
            out="$(mktemp)"; headers="$(mktemp)"
            if [ "$path" = "/api/ai/voice-agent" ]; then
              payload='{"message":"বাংলায় মালয়েশিয়া ভিসা সম্পর্কে বলুন","language":"bn","history":[]}'
            else
              payload='{"text":"আসসালামু আলাইকুম, আমি অ্যাঞ্জেলা।","language":"bn"}'
            fi
            start="$(date +%s%3N)"
            code="$(curl --silent --show-error --max-time 10 -D "$headers" -o "$out" -w '%{http_code}'               -H 'Content-Type: application/json' -H 'Origin: https://journeyexpertltd.com'               --data "$payload" "$base$path" || true)"
            end="$(date +%s%3N)"
            ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$headers" | tail -1)"
            echo "path=$path status=$code elapsed_ms=$((end-start)) content_type=$ctype bytes=$(wc -c < "$out" | tr -d ' ')"
            rm -f "$out" "$headers"
          done
