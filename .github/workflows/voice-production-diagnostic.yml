name: Angela voice production diagnostic
on:
  push:
    branches: [diag/voice-production-20260921]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe female TTS
        shell: bash
        run: |
          set -u
          for base in https://journeyexpertltd.com https://2ff832bc.journey-expert-ltd-main.pages.dev; do
            audio="$(mktemp)"
            headers="$(mktemp)"
            start="$(date +%s%3N)"
            code="$(curl --silent --show-error --max-time 10 -D "$headers" -o "$audio" -w '%{http_code}'               -H 'Content-Type: application/json' -H 'Origin: https://journeyexpertltd.com'               --data '{"text":"আসসালামু আলাইকুম, আমি অ্যাঞ্জেলা।","language":"bn"}'               "$base/api/voice/gemini" || true)"
            end="$(date +%s%3N)"
            ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$headers" | tail -1)"
            echo "base=$base tts_status=$code elapsed_ms=$((end-start)) content_type=$ctype bytes=$(wc -c < "$audio" | tr -d ' ')"
            rm -f "$audio" "$headers"
          done
