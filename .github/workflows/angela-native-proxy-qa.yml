name: Angela Native Bengali Integration QA
on:
  push:
    branches: [release]
    paths: ['.github/workflows/angela-native-proxy-qa.yml']
  workflow_dispatch:
jobs:
  native-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authentic female Bengali TTS through LTD and BD Pages proxy
        run: |
          node <<'NODE'
          (async()=>{
            const cases=[
              ['LTD Bangla','https://journeyexpertltd.com/angela/speech','bn','আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা। জার্নি এক্সপার্ট লিমিটেড থেকে আপনাকে স্বাগতম।'],
              ['BD preview Bangla','https://df562575.jel-study-abroad.pages.dev/api/angela/speech','bn','আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা। আপনি কোন দেশে পড়তে যেতে চান?'],
              ['LTD English','https://journeyexpertltd.com/angela/speech','en','Hello, I am Angela, your female travel assistant. How can I help you today?'],
              ['BD preview English','https://df562575.jel-study-abroad.pages.dev/api/angela/speech','en','Hello, I am Angela. Let me explain your university admission options.'],
            ];
            let errors=0;
            for(const [site,url,lang,text] of cases){
              const c=new AbortController();const t=setTimeout(()=>c.abort(),29000);
              try{
                const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text}),signal:c.signal});
                const bytes=Buffer.from(await r.arrayBuffer());
                const wav=r.ok&&bytes.length>1200&&bytes.toString('ascii',0,4)==='RIFF'&&bytes.toString('ascii',8,12)==='WAVE';
                const voice=r.headers.get('x-angela-voice'),mode=r.headers.get('x-angela-voice-mode'),model=r.headers.get('x-angela-voice-model');
                const pass=wav&&voice==='Aoede'&&mode===(lang==='bn'?'native-bengali-female':'english-female');
                if(!pass)errors++;
                console.log('NATIVE_PROXY_QA',JSON.stringify({site,http:r.status,bytes:bytes.length,voice,mode,model,pass,
                  error:pass?null:bytes.toString('utf8').slice(0,180)}));
              }catch(e){errors++;console.log('NATIVE_PROXY_ERROR',site,String(e))}
              finally{clearTimeout(t)}
            }
            console.log('NATIVE_PROXY_RESULT',errors===0?'PASS':'FAIL',errors);
            process.exitCode=errors?1:0;
          })().catch(e=>{console.error(e);process.exitCode=1})
          NODE
