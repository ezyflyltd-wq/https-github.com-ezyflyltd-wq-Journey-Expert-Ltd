name: One-time GSC Finalize

on:
  pull_request:
    branches: [release]
    paths:
      - '.github/workflows/one-time-gsc-finalize.yml'

permissions:
  contents: read

jobs:
  gsc-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade google-api-python-client google-auth requests
      - name: Discover accessible GSC properties and finalize matching JEL domains
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          secret = os.getenv("GSC_SERVICE_ACCOUNT_JSON", "").strip()
          if not secret:
              raise SystemExit("GSC_SERVICE_ACCOUNT_JSON is not configured")
          info = json.loads(secret)
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/webmasters"],
          )
          svc = build("searchconsole", "v1", credentials=creds, cache_discovery=False)
          sites = svc.sites().list().execute().get("siteEntry", [])
          print(json.dumps({
              "serviceAccount": info.get("client_email"),
              "accessibleSites": sites,
          }, indent=2))

          targets = [
              ("journeyexpertltd.com", "https://journeyexpertltd.com/sitemap.xml",
               ["https://journeyexpertltd.com/","https://journeyexpertltd.com/flights","https://journeyexpertltd.com/visa","https://journeyexpertltd.com/study-abroad"]),
              ("journeyexpertbd.com", "https://journeyexpertbd.com/sitemap.xml",
               ["https://journeyexpertbd.com/","https://journeyexpertbd.com/contact/","https://journeyexpertbd.com/services/"]),
          ]
          available = {x.get("siteUrl"): x.get("permissionLevel") for x in sites}
          results=[]
          for domain, sitemap, urls in targets:
              candidates=[f"sc-domain:{domain}",f"https://{domain}/"]
              site=next((x for x in candidates if x in available), None)
              if not site:
                  results.append({"domain":domain,"status":"not-accessible"})
                  continue
              svc.sitemaps().submit(siteUrl=site, feedpath=sitemap).execute()
              listed=svc.sitemaps().list(siteUrl=site).execute().get("sitemap",[])
              creds.refresh(Request())
              inspections=[]
              for url in urls:
                  r=requests.post(
                      "https://searchconsole.googleapis.com/v1/urlInspection/index:inspect",
                      headers={"Authorization": f"Bearer {creds.token}","Content-Type":"application/json"},
                      json={"inspectionUrl":url,"siteUrl":site,"languageCode":"en-US"},
                      timeout=30,
                  )
                  item={"url":url,"http":r.status_code}
                  if r.ok:
                      idx=r.json().get("inspectionResult",{}).get("indexStatusResult",{})
                      item.update({
                          "verdict":idx.get("verdict"),
                          "coverageState":idx.get("coverageState"),
                          "robotsTxtState":idx.get("robotsTxtState"),
                          "indexingState":idx.get("indexingState"),
                          "userCanonical":idx.get("userCanonical"),
                          "googleCanonical":idx.get("googleCanonical"),
                          "lastCrawlTime":idx.get("lastCrawlTime"),
                          "sitemap":idx.get("sitemap"),
                      })
                  else:
                      item["error"]=r.text[:500]
                  inspections.append(item)
              results.append({
                  "domain":domain,
                  "site":site,
                  "permission":available.get(site),
                  "sitemapSubmitted":sitemap,
                  "sitemaps":[{
                      "path":s.get("path"),
                      "lastSubmitted":s.get("lastSubmitted"),
                      "lastDownloaded":s.get("lastDownloaded"),
                      "isPending":s.get("isPending"),
                      "warnings":s.get("warnings"),
                      "errors":s.get("errors"),
                  } for s in listed],
                  "inspections":inspections,
              })
          print(json.dumps({"finalizeResults":results}, ensure_ascii=False, indent=2))
          PY
