name: AI Studio public origin probe
on:
  push:
    branches:
      - diagnostic/live-angela-smoke-20261001
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe corporate and Study AI Studio origins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          checks=[
            ('LTD_ROOT','https://journey-expert-ltd.ai.studio/',None),
            ('STUDY_ROOT','https://jel-study-abroad.ai.studio/',None),
            ('LTD_CHAT','https://journey-expert-ltd.ai.studio/api/ai/voice-agent',
             {'message':'What services does Journey Expert Limited provide?','language':'en','history':[]}),
            ('STUDY_CHAT','https://jel-study-abroad.ai.studio/api/gemini/chat',
             {'message':'What Study Abroad services do you provide?','language':'en','history':[]}),
          ]
          results={}
          for name,url,payload in checks:
              try:
                  r=requests.get(url,timeout=20,allow_redirects=False) if payload is None else requests.post(url,json=payload,timeout=25,allow_redirects=False)
                  results[name]={'status':r.status_code,'location':r.headers.get('location'),'content_type':r.headers.get('content-type'),'body':r.text[:500]}
                  print(name,'STATUS',r.status_code,'LOCATION',r.headers.get('location'),'CONTENT_TYPE',r.headers.get('content-type'))
                  if payload is not None and r.status_code==200:
                      try:
                          d=r.json()
                          reply=str(d.get('reply') or d.get('response') or '')
                          print(name,'REPLY_PRESENT',bool(reply),'REPLY',reply[:300])
                      except Exception:
                          print(name,'JSON',False)
              except Exception as e:
                  results[name]={'error':type(e).__name__+': '+str(e)[:300]}
                  print(name,'ERROR',results[name]['error'])
          print('AI_STUDIO_ORIGIN_PROBE_JSON',json.dumps(results,ensure_ascii=False))
          for root in ('LTD_ROOT','STUDY_ROOT'):
              row=results.get(root,{})
              if 'status' not in row:
                  raise SystemExit(root+' unreachable')
              if row['status'] >= 500:
                  raise SystemExit(root+' server error '+str(row['status']))
          print('AI_STUDIO_PUBLIC_ORIGINS_REACHABLE=PASS')
          PY
