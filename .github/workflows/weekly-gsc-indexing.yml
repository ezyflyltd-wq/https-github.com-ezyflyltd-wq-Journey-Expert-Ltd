name: Weekly Search Console URL inspection

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-gsc-indexing
  cancel-in-progress: false

jobs:
  inspect-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous monitoring baseline
        uses: actions/cache/restore@v4
        with:
          path: .monitor-baseline
          key: gsc-baseline-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            gsc-baseline-${{ github.repository }}-${{ github.ref_name }}-

      - name: Run technical SEO sitemap audit
        id: seo-audit
        env:
          SEO_SITE_URL: 'https://journeyexpertltd.com'
          SEO_AUDIT_OUTPUT: 'artifacts/seo-page-audit.json'
          SEO_AUDIT_STRICT: '1'
        run: |
          mkdir -p artifacts
          node scripts/audit-seo-pages.mjs

      - name: Install API client dependencies
        run: python -m pip install --upgrade google-auth requests

      - name: Check Search Console credential availability
        id: gsc-preflight
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p artifacts
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"available","message":"GSC_SERVICE_ACCOUNT_JSON is present; URL Inspection will run."}' > artifacts/gsc-credential-status.json
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"blocked","message":"GSC_SERVICE_ACCOUNT_JSON is not configured. Add the owner-supplied service-account JSON as a GitHub Actions secret; no URL Inspection API call was attempted."}' > artifacts/gsc-credential-status.json
          fi

      - name: Inspect indexed status
        id: gsc-inspection
        if: steps.gsc-preflight.outputs.available == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: 'https://journeyexpertltd.com/'
          GSC_URL_FILE: 'seo/gsc-top-urls.txt'
          GSC_OUTPUT: 'artifacts/gsc-indexing-status.json'
          GSC_STRICT: '0'
        run: |
          mkdir -p artifacts
          python scripts/inspect-gsc-indexing.py

      - name: Compare with prior monitoring baseline
        id: compare
        if: always()
        env:
          SEO_OUTPUT: artifacts/seo-page-audit.json
          GSC_OUTPUT: artifacts/gsc-indexing-status.json
          BASELINE_DIR: .monitor-baseline
          DELTA_OUTPUT: artifacts/gsc-indexing-delta.json
          SUMMARY_OUTPUT: artifacts/gsc-indexing-summary.md
        run: node scripts/compare-gsc-baseline.mjs

      - name: Add monitoring summary to the workflow run
        if: always() && hashFiles('artifacts/gsc-indexing-summary.md') != ''
        run: cat artifacts/gsc-indexing-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a GitHub alert issue
        if: always() && steps.compare.outputs.alert != '' && steps.compare.outputs.alert != 'none'
        uses: actions/github-script@v7
        env:
          ALERT_LEVEL: ${{ steps.compare.outputs.alert }}
          ALERT_COUNT: ${{ steps.compare.outputs.alerts }}
        with:
          script: |
            const fs = require('node:fs');
            const title = '[SEO Monitor] Search Console indexing alert';
            const body = fs.readFileSync('artifacts/gsc-indexing-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title);
            const message = `Automated alert level: ${process.env.ALERT_LEVEL}. Alert count: ${process.env.ALERT_COUNT}.\n\n${body}`;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: message });
            } else {
              await github.rest.issues.create({ owner, repo, title, body: message });
            }

      - name: Prepare next monitoring baseline
        if: always()
        run: |
          mkdir -p .monitor-baseline
          if [ -f artifacts/gsc-indexing-status.json ]; then cp artifacts/gsc-indexing-status.json .monitor-baseline/gsc-indexing-status.json; fi
          if [ -f artifacts/seo-page-audit.json ]; then cp artifacts/seo-page-audit.json .monitor-baseline/seo-page-audit.json; fi

      - name: Save current monitoring baseline
        if: always() && hashFiles('.monitor-baseline/*') != ''
        uses: actions/cache/save@v4
        with:
          path: .monitor-baseline
          key: gsc-baseline-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload SEO and indexing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-indexing-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30
