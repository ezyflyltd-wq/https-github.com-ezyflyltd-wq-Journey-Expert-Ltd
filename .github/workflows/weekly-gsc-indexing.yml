name: Weekly Search Console URL inspection

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API client dependencies
        run: python -m pip install --upgrade google-auth requests

      - name: Inspect indexed status
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: 'https://journeyexpertltd.com/'
          GSC_URL_FILE: 'seo/gsc-top-urls.txt'
          GSC_OUTPUT: 'artifacts/gsc-indexing-status.json'
          GSC_STRICT: '0'
        run: |
          mkdir -p artifacts
          python scripts/inspect-gsc-indexing.py

      - name: Upload indexing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-indexing-${{ github.run_id }}
          path: artifacts/gsc-indexing-status.json
          if-no-files-found: warn
          retention-days: 30
