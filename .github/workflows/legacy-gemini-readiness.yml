name: Legacy JEL Gemini Readiness
on:
  push:
    branches: [release]
    paths: ['.github/workflows/legacy-gemini-readiness.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe previously configured Cloudflare Worker Gemini binding
        run: |
          node <<'NODE'
          (async()=>{
            const h=await fetch('https://journeyexpertltd.com/api/health');
            const health=await h.json().catch(()=>({}));
            console.log('LEGACY_HEALTH',JSON.stringify({http:h.status,status:health.status,aiConfigured:health.aiConfigured,version:health.version}));
            if(!h.ok||!health.aiConfigured){process.exitCode=1;return}
            const c=new AbortController();const t=setTimeout(()=>c.abort(),25000);
            try{
              const r=await fetch('https://journeyexpertltd.com/api/ai-assistant',{
                method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({message:'What is Journey Expert Limited?',language:'en'}),signal:c.signal
              });
              const data=await r.json().catch(()=>({}));
              console.log('LEGACY_CHAT',JSON.stringify({http:r.status,answerLength:String(data.reply||'').length,
                hasResponse:!!data.reply,handoffRequired:data.handoffRequired||false,
                responsePreview:String(data.reply||'').slice(0,150)}));
              const answer=String(data.reply||'');
              const passes=r.ok&&answer.length>50&&/Journey Expert|flight|ticket|travel|visa|study abroad/i.test(answer)&&!/I understand your question\. Please share your destination/i.test(answer);
              console.log('LEGACY_RELEVANCE',JSON.stringify({pass:passes,sourceCount:Array.isArray(data.usedSources)?data.usedSources.length:0,language:data.language||null}));
              if(!passes)process.exitCode=1;
            }finally{clearTimeout(t)}
          })().catch(e=>{console.log('LEGACY_CHECK_ERROR',String(e));process.exitCode=1});
          NODE
