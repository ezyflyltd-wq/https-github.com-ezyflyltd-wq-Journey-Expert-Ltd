name: Final production freeze audit
on:
  push:
    branches:
      - diagnostic/live-angela-smoke-20261001
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Audit SEO, desktop, Android, and Apple WebKit
        shell: bash
        run: |
          cat > final-audit.mjs <<'EOF'
          import { chromium, webkit, devices } from 'playwright';

          const sites = {
            LTD: {
              url: 'https://journeyexpertltd.com',
              open: async page => {
                const first = page.getByRole('button', {name:'Open free Angela voice assistant'});
                if (await first.count()) await first.click();
                await page.waitForTimeout(2600);
                const agree = page.getByRole('button', {name:/Agree and continue/});
                if (await agree.count()) { await agree.click(); await page.waitForTimeout(300); }
              },
              input: page => page.locator('#free-angela-query'),
              send: page => page.getByRole('button',{name:'Send question'}),
              en: page => page.getByRole('dialog',{name:'Angela AI voice assistant'}).getByRole('button',{name:'EN',exact:true}),
              bnPrompt: 'তুমি কি বাংলা বলতে পারো?',
              enPrompt: 'What services does Journey Expert Limited provide?',
              replySelector: page => page.locator('body'),
              chatPath: '/angela/chat',
              bnCheck: text => /বাংলা|Journey Expert Limited|অ্যাঞ্জেলা/.test(text),
              enCheck: text => /air ticket|visa|travel|study abroad/i.test(text),
            },
            BD: {
              url: 'https://journeyexpertbd.com',
              open: async page => {
                const btn = page.locator('#btn-open-angela-assistant');
                if (await btn.count()) await btn.click();
                await page.waitForTimeout(2600);
              },
              input: page => page.locator('input[placeholder*="এয়ার টিকিট"], input[placeholder*="Ask Angela"]').first(),
              send: page => page.locator('#btn-send-angela-message'),
              en: page => page.locator('#angela-ai-voice-assistant-widget').getByRole('button',{name:/English|EN/}).first(),
              bnPrompt: 'তুমি কি বাংলা বলতে পারো?',
              enPrompt: 'Which countries can JEL Study Abroad help with?',
              replySelector: page => page.locator('body'),
              chatPath: '/api/gemini/chat',
              bnCheck: text => /বাংলা|অ্যাঞ্জেলা|Journey Expert/.test(text),
              enCheck: text => /UK|Canada|Australia|USA|Ireland|New Zealand|Malaysia|Europe/i.test(text),
            }
          };

          async function seoAudit(name, cfg) {
            const robots = await fetch(cfg.url + '/robots.txt');
            const robotsText = await robots.text();
            const sitemap = await fetch(cfg.url + '/sitemap.xml');
            const sitemapText = await sitemap.text();
            const home = await fetch(cfg.url + '/');
            const homeText = await home.text();
            console.log(name,'SEO_ROBOTS',robots.status,/sitemap:/i.test(robotsText),!/Disallow:\s*\/\s*$/im.test(robotsText));
            console.log(name,'SEO_SITEMAP',sitemap.status,/<urlset|<sitemapindex/i.test(sitemapText));
            console.log(name,'SEO_CANONICAL',home.status,new RegExp('<link[^>]+rel=["\\\']canonical["\\\'][^>]+href=["\\\']https://'+cfg.url.replace('https://','').replaceAll('.','\\.')+'/?["\\\']','i').test(homeText) || /rel=["']canonical["']/i.test(homeText));
            if (robots.status !== 200 || sitemap.status !== 200 || home.status !== 200) throw new Error(name+' SEO HTTP contract failed');
            if (!/sitemap:/i.test(robotsText)) throw new Error(name+' robots missing sitemap');
            if (!/<urlset|<sitemapindex/i.test(sitemapText)) throw new Error(name+' sitemap invalid');
          }

          function installVoiceMocks(page) {
            return page.addInitScript(() => {
              window.__angelaSpoken = [];
              class FakeUtterance {
                constructor(text){ this.text=text; this.lang=''; this.voice=null; this.rate=1; this.pitch=1; this.onstart=null; this.onend=null; this.onerror=null; }
              }
              Object.defineProperty(window,'SpeechSynthesisUtterance',{configurable:true,writable:true,value:FakeUtterance});
              const synth = window.speechSynthesis;
              if (synth) {
                synth.getVoices = () => [
                  {name:'Microsoft Nabanita Online (Natural) - Bengali (Bangladesh)',lang:'bn-BD',localService:true,default:true,voiceURI:'nabanita'},
                  {name:'Microsoft Aria Online (Natural) - English (United States)',lang:'en-US',localService:true,default:false,voiceURI:'aria'}
                ];
                synth.cancel=()=>{};
                synth.resume=()=>{};
                synth.speak=(u)=>{
                  window.__angelaSpoken.push({text:String(u.text||''),lang:String(u.lang||''),voice:String(u.voice?.name||'')});
                  try{u.onstart?.();}catch{}
                  setTimeout(()=>{try{u.onend?.();}catch{}},10);
                };
              }
            });
          }

          async function auditContext(label, browser, contextOptions) {
            const context = await browser.newContext(contextOptions);
            for (const [name,cfg] of Object.entries(sites)) {
              const page = await context.newPage();
              const errors=[];
              const responses=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{ if(r.url().includes(cfg.chatPath)) responses.push(r.status()); });

              await page.route('**/angela/speech', async route => {
                await route.fulfill({status:429,contentType:'application/json',headers:{'retry-after':'60'},body:'{"error":"voice_quota_exceeded"}'});
              });
              await page.route('**/angela/live-token', async route => {
                await route.fulfill({status:503,contentType:'application/json',body:'{"error":"live_unavailable"}'});
              });
              await page.route('**/api/gemini/live-token', async route => {
                await route.fulfill({status:503,contentType:'application/json',body:'{"error":"live_unavailable"}'});
              });
              await installVoiceMocks(page);

              await page.goto(cfg.url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1400);
              const viewportMeta = await page.locator('meta[name="viewport"]').count();
              console.log(label,name,'VIEWPORT_META',viewportMeta);
              await cfg.open(page);
              let body = await cfg.replySelector(page).innerText();
              const greeting = body.includes('আসসালামু আলাইকুম');
              console.log(label,name,'GREETING_VISIBLE',greeting);

              const input=cfg.input(page);
              if (await input.count() !== 1) throw new Error(label+' '+name+' input missing');
              await input.fill(cfg.bnPrompt);
              await cfg.send(page).click();
              await page.waitForTimeout(4300);
              body=await cfg.replySelector(page).innerText();
              const bnReply=cfg.bnCheck(body);
              const spoken1=await page.evaluate(()=>window.__angelaSpoken||[]);
              const bnSpoken=spoken1.some(x=>String(x.lang).toLowerCase().startsWith('bn'));
              console.log(label,name,'BN_CHAT_200',responses.includes(200),'BN_REPLY',bnReply,'BN_SPOKEN',bnSpoken);

              const en=cfg.en(page);
              if (await en.count()) { await en.click(); await page.waitForTimeout(100); }
              await input.fill(cfg.enPrompt);
              await cfg.send(page).click();
              await page.waitForTimeout(4300);
              body=await cfg.replySelector(page).innerText();
              const enReply=cfg.enCheck(body);
              const spoken2=await page.evaluate(()=>window.__angelaSpoken||[]);
              const enSpoken=spoken2.some(x=>String(x.lang).toLowerCase().startsWith('en'));
              console.log(label,name,'EN_REPLY',enReply,'EN_SPOKEN',enSpoken,'PAGE_ERRORS',JSON.stringify(errors));

              if (!viewportMeta || !greeting || !responses.includes(200) || !bnReply || !bnSpoken || !enReply || !enSpoken || errors.length) {
                throw new Error(label+' '+name+' production freeze audit failed');
              }
              await page.close();
            }
            await context.close();
          }

          for (const [name,cfg] of Object.entries(sites)) await seoAudit(name,cfg);

          const chrome = await chromium.launch({headless:true,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          await auditContext('DESKTOP_CHROME',chrome,{viewport:{width:1440,height:900}});
          await auditContext('ANDROID_CHROME',chrome,{...devices['Pixel 7']});
          await chrome.close();

          const safari = await webkit.launch({headless:true});
          await auditContext('APPLE_WEBKIT',safari,{...devices['iPhone 14']});
          await safari.close();

          console.log('FINAL_PRODUCTION_FREEZE_AUDIT=PASS');
          EOF
          node final-audit.mjs

# rerun-after-bd-android-fix
