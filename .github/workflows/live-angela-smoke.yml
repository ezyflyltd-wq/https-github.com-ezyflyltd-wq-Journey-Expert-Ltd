name: Live Angela bilingual browser verification
on:
  push:
    branches:
      - diagnostic/live-angela-smoke-20261001
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify both live Angela widgets
        shell: bash
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox','--autoplay-policy=no-user-gesture-required']
          });

          async function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
          async function auditLTD(){
            const ctx=await browser.newContext();
            const page=await ctx.newPage();
            const responses=[];
            page.on('response',r=>{
              if(r.url().includes('/angela/')||r.url().includes('/api/ai/voice-agent'))
                responses.push({url:r.url(),status:r.status(),ct:r.headers()['content-type']||''});
            });
            page.on('pageerror',e=>console.log('LTD_PAGEERROR',e.message));
            await page.goto('https://journeyexpertltd.com',{waitUntil:'domcontentloaded',timeout:60000});
            await wait(2500);
            const first=page.getByRole('button',{name:'Open free Angela voice assistant'});
            console.log('LTD_FIRST_BUTTON',await first.count());
            await first.click();
            await wait(5000);
            let body=await page.locator('body').innerText();
            console.log('LTD_GREETING_FIRST_CLICK',body.includes('আসসালামু আলাইকুম'));
            console.log('LTD_SPEECH_FIRST',JSON.stringify(responses.filter(x=>x.url.includes('/angela/speech'))));

            const agree=page.getByRole('button',{name:/Agree and continue/});
            if(await agree.count()) { await agree.click(); await wait(800); }

            const input=page.locator('#free-angela-query');
            await input.fill('তুমি কি বাংলা বলতে পারো?');
            await page.getByRole('button',{name:'Send question'}).click();
            await wait(6500);
            body=await page.locator('body').innerText();
            console.log('LTD_BN_QUERY_VISIBLE',body.includes('তুমি কি বাংলা বলতে পারো?'));
            console.log('LTD_BN_REPLY_VISIBLE',body.includes('Angela:'));
            console.log('LTD_BN_CHAT',JSON.stringify(responses.filter(x=>x.url.includes('/angela/chat'))));

            await page.getByRole('button',{name:'EN'}).click();
            await input.fill('What services does Journey Expert Limited provide?');
            await page.getByRole('button',{name:'Send question'}).click();
            await wait(6500);
            body=await page.locator('body').innerText();
            console.log('LTD_EN_QUERY_VISIBLE',body.includes('What services does Journey Expert Limited provide?'));
            console.log('LTD_EN_REPLY_VISIBLE',/air ticket|visa|travel|study abroad/i.test(body));
            console.log('LTD_ALL_SPEECH',JSON.stringify(responses.filter(x=>x.url.includes('/angela/speech'))));
            await ctx.close();
          }

          async function auditBD(){
            const ctx=await browser.newContext();
            const page=await ctx.newPage();
            const responses=[];
            page.on('response',r=>{
              if(r.url().includes('/angela/')||r.url().includes('/api/gemini/chat'))
                responses.push({url:r.url(),status:r.status(),ct:r.headers()['content-type']||''});
            });
            page.on('pageerror',e=>console.log('BD_PAGEERROR',e.message));
            await page.goto('https://journeyexpertbd.com',{waitUntil:'domcontentloaded',timeout:60000});
            await wait(2500);
            const btn=page.locator('#btn-open-angela-assistant');
            console.log('BD_OPEN_BUTTON',await btn.count());
            await btn.click();
            await wait(5000);
            let body=await page.locator('body').innerText();
            console.log('BD_GREETING_FIRST_CLICK',body.includes('আসসালামু আলাইকুম'));
            console.log('BD_SPEECH_FIRST',JSON.stringify(responses.filter(x=>x.url.includes('/angela/speech'))));

            const input=page.locator('input[placeholder*="এয়ার টিকিট"], input[placeholder*="Ask Angela"]').first();
            console.log('BD_INPUT_COUNT',await input.count());
            await input.fill('তুমি কি বাংলা বলতে পারো?');
            await page.locator('#btn-send-angela-message').click();
            await wait(6500);
            body=await page.locator('body').innerText();
            console.log('BD_BN_QUERY_VISIBLE',body.includes('তুমি কি বাংলা বলতে পারো?'));
            console.log('BD_BN_REPLY_VISIBLE',body.includes('বাংলা')||body.includes('অ্যাঞ্জেলা'));
            console.log('BD_BN_CHAT',JSON.stringify(responses.filter(x=>x.url.includes('/api/gemini/chat'))));

            const en=page.getByRole('button',{name:/English|EN/}).first();
            if(await en.count()) await en.click();
            await input.fill('Which countries can JEL Study Abroad help with?');
            await page.locator('#btn-send-angela-message').click();
            await wait(6500);
            body=await page.locator('body').innerText();
            console.log('BD_EN_QUERY_VISIBLE',body.includes('Which countries can JEL Study Abroad help with?'));
            console.log('BD_EN_REPLY_VISIBLE',/UK|Canada|Australia|USA|Ireland|New Zealand|Malaysia|Europe/i.test(body));
            console.log('BD_ALL_SPEECH',JSON.stringify(responses.filter(x=>x.url.includes('/angela/speech'))));
            await ctx.close();
          }

          await auditLTD();
          await auditBD();
          await browser.close();
          EOF
          node audit.mjs
