name: Live Angela smoke
on:
  push:
    branches:
      - diagnostic/live-angela-smoke-20261001
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live homepages
        shell: bash
        run: |
          set -euxo pipefail
          curl -I --fail --max-time 20 https://journeyexpertltd.com/
          curl -I --fail --max-time 20 https://journeyexpertbd.com/
      - name: Check both Angela speech endpoints
        shell: bash
        run: |
          set -u
          failed=0
          for url in             https://journeyexpertltd.com/angela/speech             https://journeyexpertbd.com/angela/speech
          do
            echo "===== Testing $url ====="
            rm -f /tmp/voice.bin /tmp/headers.txt
            status=$(curl -sS --max-time 35 -o /tmp/voice.bin -D /tmp/headers.txt               -w "%{http_code}"               -H 'Content-Type: application/json'               --data '{"text":"আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা।","language":"bn"}'               "$url" || true)
            bytes=$(wc -c </tmp/voice.bin 2>/dev/null || echo 0)
            content_type=$(grep -i '^content-type:' /tmp/headers.txt 2>/dev/null | tail -1 | tr -d '\r' || true)
            voice=$(grep -i '^x-angela-voice:' /tmp/headers.txt 2>/dev/null | tail -1 | tr -d '\r' || true)
            model=$(grep -i '^x-angela-voice-model:' /tmp/headers.txt 2>/dev/null | tail -1 | tr -d '\r' || true)
            echo "HTTP=$status"
            echo "BYTES=$bytes"
            echo "$content_type"
            echo "$voice"
            echo "$model"
            if [ "$status" != "200" ] || [ "$bytes" -lt 1000 ] || ! echo "$content_type" | grep -Eiq 'audio/wav|audio/'; then
              echo "FAILED_ENDPOINT=$url"
              head -c 500 /tmp/voice.bin | strings || true
              failed=1
            else
              echo "PASSED_ENDPOINT=$url"
            fi
          done
          exit "$failed"
