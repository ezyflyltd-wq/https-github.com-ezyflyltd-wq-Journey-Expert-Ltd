name: Live Angela frontend audit
on:
  push:
    branches:
      - diagnostic/live-angela-smoke-20261001
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit live frontend bundles
        shell: bash
        run: |
          set -euo pipefail
          for site in journeyexpertltd.com journeyexpertbd.com
          do
            echo "===== $site ====="
            curl -sS --max-time 30 "https://$site/" -o /tmp/index.html
            echo "HTML_BYTES=$(wc -c </tmp/index.html)"
            grep -oE '<script[^>]+src="[^"]+"' /tmp/index.html || true
            mapfile -t scripts < <(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/index.html | sed -E 's/^src="|"$//g' | sort -u)
            echo "SCRIPT_COUNT=${#scripts[@]}"
            found_angela=0
            found_greeting=0
            for src in "${scripts[@]}"
            do
              if [[ "$src" == http* ]]; then url="$src"; else url="https://$site${src#/}"; fi
              echo "FETCH $url"
              curl -sS --max-time 30 "$url" -o /tmp/app.js || continue
              bytes=$(wc -c </tmp/app.js)
              echo "JS_BYTES=$bytes"
              if grep -aFq "Angela" /tmp/app.js; then echo "FOUND_ANGELA_IN=$url"; found_angela=1; fi
              if grep -aFq "আসসালামু আলাইকুম" /tmp/app.js; then echo "FOUND_BANGLA_GREETING_IN=$url"; found_greeting=1; fi
              if grep -aFq "btn-open-angela-assistant" /tmp/app.js; then echo "FOUND_OPEN_BUTTON_ID_IN=$url"; fi
              if grep -aFq "female_voice_unavailable" /tmp/app.js; then echo "FOUND_OLD_VOICE_ERROR_IN=$url"; fi
            done
            echo "FOUND_ANGELA=$found_angela"
            echo "FOUND_GREETING=$found_greeting"
            if [ "$found_angela" -ne 1 ] || [ "$found_greeting" -ne 1 ]; then
              echo "FRONTEND_CONTRACT_FAIL=$site"
              exit 41
            fi
          done
