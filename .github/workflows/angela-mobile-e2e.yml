name: Angela Mobile Chrome E2E
on:
  push:
    branches: [release]
    paths: ['.github/workflows/angela-mobile-e2e.yml']
  workflow_dispatch:
jobs:
  mobile-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install headless Chrome controller
        run: |
          npm install --prefix /tmp/jel-browser puppeteer-core@24.15.0 --no-audit --no-fund
          which google-chrome
      - name: Verify mobile UI, repeated messages and speaker status
        run: |
          node <<'NODE'
          const {execFileSync}=require('child_process');
          const puppeteer=require('/tmp/jel-browser/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:execFileSync('which',['google-chrome']).toString().trim(),
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--use-fake-ui-for-media-stream'],
            });
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:2});
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Mobile Safari/537.36');
            const errors=[];const networkFailures=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console '+m.text().slice(0,220))});
            page.on('requestfailed',r=>networkFailures.push(r.url().split('?')[0]+' '+r.failure()?.errorText));
            page.on('pageerror',e=>errors.push(String(e).slice(0,150)));
            const home=await page.goto('https://journeyexpertltd.com/',{waitUntil:'domcontentloaded',timeout:30000});
            console.log('MOBILE_HOME',home.status());
            await page.waitForSelector('button[aria-label="Open free Angela voice assistant"],button[aria-label="Open Angela AI voice assistant"]',{timeout:15000});
            await page.click('button[aria-label="Open free Angela voice assistant"],button[aria-label="Open Angela AI voice assistant"]');
            if(!(await page.$('#free-angela-query'))){
              const consentSelector='button';
              try {
                await page.waitForFunction(()=>[...document.querySelectorAll('button')].some(x=>x.textContent.includes('Agree and continue')),{timeout:11000});
              } catch (err) {
                const diag=await page.evaluate(()=>({text:document.body.innerText.slice(-1400),buttons:[...document.querySelectorAll('button')].map(b=>({label:b.getAttribute('aria-label'),text:b.textContent.slice(0,70)})).slice(-18)}));
                console.log('MOBILE_OPEN_DIAGNOSTIC',JSON.stringify({...diag,errors,networkFailures,dom:{ready:await page.evaluate(()=>document.readyState),url:page.url()}}));
                // Clicking before React hydration can miss the mobile launcher.
                const launcher=await page.$('button[aria-label="Open free Angela voice assistant"],button[aria-label="Open Angela AI voice assistant"]');
                if(launcher){ await launcher.click(); await page.evaluate(()=>document.querySelector('button[aria-label="Open free Angela voice assistant"]')?.click()); }
                await page.waitForFunction(()=>[...document.querySelectorAll('button')].some(x=>x.textContent.includes('Agree and continue'))||!!document.querySelector('#free-angela-query'),{timeout:12000});
              }
              await page.evaluate(()=>[...document.querySelectorAll('button')].find(x=>x.textContent.includes('Agree and continue'))?.click());
            }
            await page.waitForSelector('#free-angela-query',{timeout:12000});
            const prompts=[
              'বাংলাদেশ থেকে বিদেশে পড়তে গেলে কোথা থেকে শুরু করব?',
              'How can your agency help with flights?',
              'আমি কি ভিসা অনুমোদন গ্যারান্টি পাব?',
            ];
            let pass=0;
            for(const prompt of prompts){
              await page.type('#free-angela-query',prompt,{delay:5});
              await page.waitForFunction(()=>!!document.querySelector('#free-angela-query')?.value && !document.querySelector('button[aria-label="Send question"]')?.disabled,{timeout:9000});
              console.log('MOBILE_BEFORE_SUBMIT',JSON.stringify(await page.evaluate(()=>({text:document.querySelector('#free-angela-query')?.value,disabled:document.querySelector('button[aria-label="Send question"]')?.disabled}))));
              const responsePromise=page.waitForResponse(x=>x.url().includes('/angela/chat')&&x.request().method()==='POST',{timeout:28000});
              await page.click('button[aria-label="Send question"]');
              let response;
              try {response=await responsePromise;}
              catch(err) {
                console.log('MOBILE_SEND_DIAGNOSTIC',JSON.stringify({
                  state:await page.evaluate(()=>({text:document.querySelector('#free-angela-query')?.value,lastReply:[...document.querySelectorAll('p')].find(x=>x.textContent.startsWith('Angela:'))?.textContent.slice(0,200),buttons:[...document.querySelectorAll('button')].filter(x=>x.textContent.includes('Thinking')||x.getAttribute('aria-label')==='Send question').map(x=>({label:x.getAttribute('aria-label'),disabled:x.disabled}))})),
                  errors,networkFailures,
                }));
                throw err;
              }
              const data=await response.json();
              const reply=String(data.reply||'');
              if(response.status()!==200||data.mode!=='ai'||reply.length<20){
                console.log('MOBILE_FAIL',JSON.stringify({prompt,http:response.status(),mode:data.mode,reason:data.reason}));
                throw Error('Mobile assistant failed to answer');
              }
              await page.waitForFunction(x=>[...document.querySelectorAll('p')].some(p=>p.textContent.startsWith('Angela:')&&p.textContent.includes(x)),{timeout:9000},reply.slice(0,35));
              console.log('MOBILE_REPLY',JSON.stringify({language:/[\u0980-\u09ff]/.test(prompt)?'bn':'en',status:response.status(),mode:data.mode,chars:reply.length,model:data.providerModel}));
              pass++;
            }
            const ui=await page.evaluate(()=>({width:document.documentElement.scrollWidth,viewport:innerWidth,speaker:!!document.querySelector('button[aria-label="Mute spoken replies"]'),mic:!![...document.querySelectorAll('button')].find(x=>x.textContent.includes('Start speaking'))}));
            console.log('MOBILE_UI',JSON.stringify(ui),'ERRORS',JSON.stringify(errors));
            await browser.close();
            if(pass!==prompts.length||ui.width>ui.viewport+8||!ui.mic||errors.length)process.exitCode=1;
          })().catch(e=>{console.error('MOBILE_TEST_ERROR',String(e));process.exit(1)});
          NODE
