# Reviewed production policy path: changes require an explicit approval marker.
name: Production Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-guard:
    name: Sync safety gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve reviewed commit message
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            reviewed_sha="${{ github.event.pull_request.head.sha }}"
          else
            reviewed_sha="$GITHUB_SHA"
          fi
          {
            echo 'GITHUB_COMMIT_MESSAGE<<SYNC_COMMIT_MESSAGE'
            git log -1 --format=%B "$reviewed_sha"
            echo 'SYNC_COMMIT_MESSAGE'
            echo 'GITHUB_HEAD_COMMIT_MESSAGE<<SYNC_HEAD_COMMIT_MESSAGE'
            git log -1 --format=%B "$reviewed_sha"
            echo 'SYNC_HEAD_COMMIT_MESSAGE'
          } >> "$GITHUB_ENV"

      - name: Run automated sync guard
        run: node scripts/sync-guard.mjs

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-guard-report
          path: sync-guard-report.md
          if-no-files-found: ignore

  validate:
    name: Type-check and Pages build
    needs: sync-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm run lint

      - name: Test Angela SDK 429 fallback
        run: pnpm run test:angela-429

      - name: Test signed-URL endpoint quota mapping
        run: pnpm run test:angela-signed-url

      - name: Build Cloudflare Pages output
        run: pnpm run build:pages

      - name: Verify required SEO and Pages assets
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_headers
          test -f dist/_redirects
          test -f functions/api/[[path]].ts
          test -f functions/api/elevenlabs/signed-url.ts

  promote:
    name: Promote validated source to Cloudflare release branch
    needs: [sync-guard, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release branch
        run: git push origin HEAD:refs/heads/release
