name: Production Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-guard:
    name: Sync safety gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
      GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run automated sync guard
        run: node scripts/sync-guard.mjs

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-guard-report
          path: sync-guard-report.md
          if-no-files-found: ignore

  validate:
    name: Type-check and Pages build
    needs: sync-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm run lint

      - name: Build Cloudflare Pages output
        run: pnpm run build:pages

      - name: Verify required SEO and Pages assets
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_headers
          test -f dist/_redirects
          test -f functions/api/[[path]].ts

  promote:
    name: Promote validated source to Cloudflare release branch
    needs: [sync-guard, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release branch
        run: git push origin HEAD:refs/heads/release
