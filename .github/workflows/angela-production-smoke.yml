name: Angela Production Smoke
on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/angela-production-smoke.yml'
  workflow_dispatch:
jobs:
  verify-public-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test production homepages and real Bengali-English chat endpoints
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          node <<'NODE'
          const targets = [
            { name: 'LTD', origin: 'https://journeyexpertltd.com', pagesOrigin: 'https://journey-expert-ltd-main.pages.dev', health: '/angela/health', expectedMarker: 'jel-ltd-angela-health-20261010', endpoint: '/angela/chat', body: (message, language) => ({ message, language, history: [] }) },
            { name: 'BD', origin: 'https://journeyexpertbd.com', pagesOrigin: 'https://jel-study-abroad.pages.dev', health: '/api/gemini/health', expectedMarker: 'jel-bd-angela-health-20261010', endpoint: '/api/gemini/chat', body: (message, language) => ({ messages: [{ sender: 'user', text: message }], language, source: 'text' }) },
          ];
          let failures = 0;
          const probe = async (url, options = {}) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 25000);
            try { return await fetch(url, { ...options, signal: controller.signal, redirect: 'follow' }); }
            finally { clearTimeout(timer); }
          };
          for (const site of targets) {
            try {
              const home = await probe(site.origin);
              console.log(site.name + ': homepage HTTP ' + home.status);
              if (!home.ok) failures++;
            } catch (error) {
              failures++;
              console.error(site.name + ': homepage failed:', String(error));
            }
            for (const [label, origin] of [['custom-domain',site.origin],['pages-dev',site.pagesOrigin]]) {
              try {
                const h = await probe(origin + site.health);
                const ct = h.headers.get('content-type') || '';
                const raw = await h.text();
                let data = {};
                try { data = JSON.parse(raw); } catch {}
                const ok = h.ok && data.routeMarker === site.expectedMarker;
                console.log(JSON.stringify({ website: site.name, via: label, healthHTTP: h.status, contentType: ct, marker: data.routeMarker || 'missing', pageStart: typeof data.routeMarker === 'string' ? '' : raw.slice(0, 130), pass: ok }));
                if (!ok) failures++;
              } catch (err) { failures++; console.error(site.name + ' ' + label + ' health failed:', String(err)); }
            }
            for (const [language, message] of [
              ['bn', 'বাংলাদেশ থেকে অস্ট্রেলিয়ায় পড়তে গেলে সাধারণত কোন কাগজপত্র লাগে?'],
              ['en', 'What is the difference between a tourist visa and a student visa?'],
            ]) {
              try {
                const response = await probe(site.origin + site.endpoint, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(site.body(message, language)),
                });
                const data = await response.json().catch(() => ({}));
                const answer = String(data.reply || '').trim();
                const actualLanguage = /[\u0980-\u09ff]/.test(answer) ? 'bn' : 'en';
                console.log(JSON.stringify({
                  website: site.name, requestedLanguage: language, http: response.status,
                  mode: data.mode || 'missing', model: data.providerModel || 'none',
                  answerLength: answer.length, answerLanguage: actualLanguage,
                  answerPreview: answer.slice(0, 170), replyKeys: Object.keys(data).slice(0, 12),
                  backendHeader: response.headers.get('x-angela-backend') || 'missing',
                }));
                if (!response.ok || !answer || actualLanguage !== language ||
                    ['fallback','ai_unavailable'].includes(data.mode)) failures++;
              } catch (error) {
                failures++;
                console.error(site.name + ' ' + language + ':', String(error));
              }
            }
          }
          if (failures) console.error('Production check failed:', failures, 'issue(s). Inspect Gemini credential/quota/runtime responses; no customer secret was exposed.');
          process.exitCode = failures ? 1 : 0;
          NODE
