name: One-off reviewed release production deploy
on:
  push:
    branches:
      - diagnostic/live-angela-smoke-20261001
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7b0d4036973a06b9cd4622770748a101"
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - name: Verify reviewed release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e342c68f5ebb729141894b6f50a78bc09cfe23cd"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build:pages
      - run: pnpm run test:free-voice
      - name: Deploy reviewed release
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist             --project-name=journey-expert-ltd-main             --branch=release             --commit-hash="e342c68f5ebb729141894b6f50a78bc09cfe23cd"
      - name: Verify live contact brain contract
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          node - <<'NODE'
          const r=await fetch('https://journeyexpertltd.com/angela/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:'Journey Expert Limited কী কী সার্ভিস দেয় এবং যোগাযোগ নম্বর কী?',language:'bn',conversationId:'deploy-check',history:[]})});
          const d=await r.json();
          const reply=String(d.reply||d.response||'');
          console.log(reply);
          if(r.status!==200 || !/01926400400|01926.?400400|\+8801926400400/.test(reply)) throw new Error('live contact brain contract failed');
          console.log('REVIEWED_RELEASE_DEPLOY=PASS');
          NODE
