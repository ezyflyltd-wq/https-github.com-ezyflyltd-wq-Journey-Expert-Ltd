# Production-approved Angela live smoke repair; validates public endpoints only.
name: Angela production live smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/angela-live-smoke.yml"
      - "src/components/FreeVoiceAngelaWidget.tsx"
      - "functions/api/**"
      - "server/angelaBrain.ts"
      - "workers/angela-worker.js"
  schedule:
    - cron: "47 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angela-production-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify journeyexpertltd.com and Angela
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public site and SEO controls
        shell: bash
        run: |
          set -euo pipefail
          base="https://journeyexpertltd.com"
          status="$(curl --fail --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$base/")"
          test "$status" = "200"
          curl --fail --silent --show-error --max-time 20 "$base/robots.txt" | grep -F "sitemap"
          sitemap="$(curl --fail --silent --show-error --max-time 20 "$base/sitemap.xml")"
          test "$(grep -o '<loc>' <<< "$sitemap" | wc -l)" -ge 20

      - name: Check Pages API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 https://journeyexpertltd.com/api/health)"
          test -n "$body"
          ! grep -E 'API_KEY|SERVICE_ROLE|PASSWORD|SECRET' <<< "$body"

      - name: Check live Angela Bangla response through same-origin API
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --fail --silent --show-error --max-time 25 \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertltd.com' \
            --data '{"message":"ami Malaysia tourist visa ebong tour package niye jante chai","language":"bn","conversationId":"production-smoke","history":[]}' \
            --output "$body" \
            https://journeyexpertltd.com/api/ai/voice-agent
          python - "$body" <<'PY'
          import json, re, sys
          p = sys.argv[1]
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          reply = str(data.get("reply") or data.get("response") or "").strip()
          if not reply:
              raise SystemExit("Angela returned no reply")
          if not re.search(r"[\u0980-\u09ff]", reply):
              raise SystemExit("Angela did not return Bengali")
          lower = reply.lower()
          for bad in ("live ai unavailable", "safe assistance mode", "নিরাপদ সহায়তা মোড"):
              if bad in lower:
                  raise SystemExit("Angela returned a degraded canned fallback")
          print("Angela live Bangla response passed")
          PY

      - name: Check live Angela female voice capability
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          audio="$(mktemp)"
          token_body="$(mktemp)"
          trap 'rm -f "$headers" "$audio" "$token_body"' EXIT
          status="$(curl --silent --show-error \
            --max-time 20 \
            --dump-header "$headers" \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertltd.com' \
            --data '{"text":"আসসালামু আলাইকুম, আমি অ্যাঞ্জেলা।","language":"bn"}' \
            --output "$audio" \
            --write-out '%{http_code}' \
            https://journeyexpertltd.com/api/voice/gemini)"
          if [ "$status" = "200" ]; then
            grep -qi '^content-type: audio/wav' "$headers"
            test "$(wc -c < "$audio")" -gt 1000
            test "$(head -c 4 "$audio")" = "RIFF"
            echo "Angela primary female TTS passed"
          elif [ "$status" = "429" ] || [ "$status" = "502" ] || [ "$status" = "503" ]; then
            node --input-type=module <<'NODE'
            const base = 'https://journeyexpertltd.com';
            const tokenRes = await fetch(base + '/api/gemini/live-token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Origin: base },
            });
            if (!tokenRes.ok) throw new Error('Live token HTTP ' + tokenRes.status);
            const tokenData = await tokenRes.json();
            if (!tokenData.token || tokenData.model !== 'gemini-3.8-live') throw new Error('Invalid Live token response');

            const wsUrl = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=' + encodeURIComponent(tokenData.token);
            const audioBytes = await new Promise((resolve, reject) => {
              const ws = new WebSocket(wsUrl);
              let total = 0;
              let sent = false;
              let settled = false;
              const timer = setTimeout(() => finish(new Error('Gemini Live audio timeout')), 12000);
              const finish = (err) => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                try { ws.close(); } catch {}
                err ? reject(err) : resolve(total);
              };
              ws.onopen = () => ws.send(JSON.stringify({
                setup: {
                  model: 'models/gemini-3.8-live',
                  generationConfig: {
                    responseModalities: ['AUDIO'],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Aoede' } } },
                  },
                  systemInstruction: {
                    parts: [{ text: 'Speak the supplied transcript verbatim as a professional adult female voice. Do not add words.' }],
                  },
                },
              }));
              ws.onmessage = async (event) => {
                const raw = typeof event.data === 'string' ? event.data : await event.data.text?.() ?? String(event.data);
                const msg = JSON.parse(raw);
                if (msg.setupComplete && !sent) {
                  sent = true;
                  ws.send(JSON.stringify({
                    clientContent: {
                      turns: [{ role: 'user', parts: [{ text: 'আসসালামু আলাইকুম, আমি অ্যাঞ্জেলা।' }] }],
                      turnComplete: true,
                    },
                  }));
                  return;
                }
                for (const part of msg.serverContent?.modelTurn?.parts || []) {
                  if (part?.inlineData?.data && (!part.inlineData.mimeType || String(part.inlineData.mimeType).includes('audio'))) {
                    total += Buffer.from(part.inlineData.data, 'base64').length;
                  }
                }
                if (msg.serverContent?.generationComplete || msg.serverContent?.turnComplete) {
                  if (total > 1000) finish();
                }
              };
              ws.onerror = () => finish(new Error('Gemini Live WebSocket error'));
              ws.onclose = () => {
                if (!settled) total > 1000 ? finish() : finish(new Error('Gemini Live closed without audio'));
              };
            });
            if (audioBytes <= 1000) throw new Error('Gemini Live returned insufficient audio');
            console.log('Angela Gemini Live Aoede female audio passed:', audioBytes, 'bytes');
            NODE
          else
            echo "Unexpected Angela female voice status: $status" >&2
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Angela production live smoke"
            echo "- Target: https://journeyexpertltd.com"
            echo "- Public site and SEO controls checked."
            echo "- Pages API health checked."
            echo "- Angela same-origin API probed with a real Banglish-to-Bangla request."
            echo "- Female voice capability checked through primary Gemini TTS or Gemini 3.8 Live fallback."
            echo "- Angela female voice probed end-to-end: primary Gemini TTS or verified Gemini 3.8 Live Aoede audio."
            echo "- Cadence: every 12 hours plus relevant production pushes."
          } >> "$GITHUB_STEP_SUMMARY"
