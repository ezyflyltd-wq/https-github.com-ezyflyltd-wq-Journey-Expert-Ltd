name: Angela production live smoke

on:
  push:
    branches:
      - diag/main-angela-hindi-tts-20260921

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production health version
        shell: bash
        run: |
          set -u
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 10 --output "$body" --write-out '%{http_code}' https://journeyexpertltd.com/api/health || true)"
          echo "HEALTH code=$status body=$(cat "$body")"
          rm -f "$body"

      - name: Probe bounded text routes
        shell: bash
        run: |
          set -u
          for spec in             'bn|আমি মালয়েশিয়া ভিসা সম্পর্কে জানতে চাই'             'en|I want information about Malaysia tourist visa'             'hi|मुझे मलेशिया टूरिस्ट वीज़ा के बारे में जानकारी चाहिए'; do
            lang="${spec%%|*}"; msg="${spec#*|}"; body="$(mktemp)"
            metrics="$(curl --silent --show-error --max-time 8               --header 'Content-Type: application/json'               --header 'Origin: https://journeyexpertltd.com'               --data "$(jq -nc --arg m "$msg" --arg l "$lang" '{message:$m,language:$l,conversationId:"probe",history:[]}')"               --output "$body"               --write-out 'code=%{http_code} total=%{time_total} start=%{time_starttransfer}'               https://journeyexpertltd.com/api/ai/voice-agent || true)"
            if jq -e . "$body" >/dev/null 2>&1; then
              echo "TEXT $lang $metrics mode=$(jq -r '.mode // ""' "$body") detected=$(jq -r '.language // ""' "$body") reply_len=$(jq -r '.reply // .response // ""' "$body" | wc -m | tr -d ' ')"
            else
              echo "TEXT $lang $metrics non_json bytes=$(wc -c < "$body" | tr -d ' ')"
            fi
            rm -f "$body"
          done

      - name: Probe bounded female TTS
        shell: bash
        run: |
          set -u
          body="$(mktemp)"; headers="$(mktemp)"
          metrics="$(curl --silent --show-error --max-time 8 --dump-header "$headers"             --header 'Content-Type: application/json' --header 'Origin: https://journeyexpertltd.com'             --data '{"text":"হ্যালো, আমি অ্যাঞ্জেলা।","language":"bn"}'             --output "$body" --write-out 'code=%{http_code} total=%{time_total} type=%{content_type}'             https://journeyexpertltd.com/api/voice/gemini || true)"
          echo "TTS $metrics bytes=$(wc -c < "$body" | tr -d ' ') first4=$(head -c 4 "$body" 2>/dev/null || true)"
