name: Angela production live smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/angela-live-smoke.yml"
      - "src/components/FreeVoiceAngelaWidget.tsx"
      - "functions/api/**"
      - "server/angelaBrain.ts"
      - "workers/angela-worker.js"
  schedule:
    - cron: "47 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angela-production-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify journeyexpertltd.com and Angela
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public site and SEO controls
        shell: bash
        run: |
          set -euo pipefail
          base="https://journeyexpertltd.com"
          status="$(curl --fail --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$base/")"
          test "$status" = "200"
          curl --fail --silent --show-error --max-time 20 "$base/robots.txt" | grep -F "sitemap"
          sitemap="$(curl --fail --silent --show-error --max-time 20 "$base/sitemap.xml")"
          test "$(grep -o '<loc>' <<< "$sitemap" | wc -l)" -ge 20

      - name: Check Pages API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 https://journeyexpertltd.com/api/health)"
          test -n "$body"
          ! grep -E 'API_KEY|SERVICE_ROLE|PASSWORD|SECRET' <<< "$body"

      - name: Check live Angela Bangla response through AI Studio
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --fail --silent --show-error --max-time 25             --header 'Content-Type: application/json'             --header 'Origin: https://journeyexpertltd.com'             --data '{"message":"ami Malaysia tourist visa ebong tour package niye jante chai","language":"auto","conversationId":"production-smoke","history":[]}'             --output "$body"             https://journeyexpertltd.com/api/ai/voice-agent
          python - "$body" <<'PY'
import json, re, sys
p=sys.argv[1]
with open(p, encoding="utf-8") as f:
    data=json.load(f)
reply=str(data.get("reply") or data.get("response") or "").strip()
if not reply:
    raise SystemExit("Angela returned no reply")
if not re.search(r"[\u0980-\u09ff]", reply):
    raise SystemExit("Angela did not return Bengali for Banglish input")
lower=reply.lower()
for bad in ("live ai unavailable", "safe assistance mode", "নিরাপদ সহায়তা মোড"):
    if bad in lower:
        raise SystemExit("Angela returned a degraded canned fallback")
print("Angela live Bangla response passed")
PY

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Angela production live smoke"
            echo "- Target: https://journeyexpertltd.com"
            echo "- Public site and SEO controls checked."
            echo "- Pages API health checked."
            echo "- Angela AI Studio path probed with a real Banglish-to-Bangla request."
            echo "- Cadence: every 12 hours plus relevant production pushes."
          } >> "$GITHUB_STEP_SUMMARY"
